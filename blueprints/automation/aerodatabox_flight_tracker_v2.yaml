blueprint:
  name: AeroDataBox Flight Tracker — flight and date
  description: 'One flight per automation. Look up its scheduled departure using the
    saved AeroDataBox RapidAPI integration, register it in Flightradar24 at the selected
    offset before departure, and notify on takeoff and landing. Runs a bounded 12-hour
    schedule check near the requested date. Self-disables following the matching landing
    event or after the expiry window. Does not permanently delete automation or flight
    tracking records.

    '
  domain: automation
  author: ChatGPT
  homeassistant:
    min_version: 2024.10.0
  input:
    airline:
      name: Airline code
      description: IATA airline code (e.g. DL)
      selector:
        text:
          multiline: false
          multiple: false
    flight:
      name: Flight number
      description: Numeric part only (e.g. 2084)
      selector:
        text:
          multiline: false
          multiple: false
    flight_date:
      name: Departure date at the origin
      selector:
        date: {}
    travelers:
      name: Travelers on this flight
      description: Select one or more Home Assistant Person entities.
      default: []
      selector:
        entity:
          domain:
          - person
          multiple: true
          reorder: false
    offset_hours:
      name: Start tracking hours before departure
      default: 2
      selector:
        number:
          min: 0.0
          max: 24.0
          step: 0.5
          unit_of_measurement: h
          mode: box
    notify_entity:
      name: Phone notification targets (optional; leave blank for all phones)
      default: []
      selector:
        entity:
          domain:
          - notify
          multiple: true
          reorder: false
mode: parallel
max: 5
variables:
  airline_code: !input airline
  numeric_flight: !input flight
  departure_date: !input flight_date
  flight_travelers: !input travelers
  early_hours: !input offset_hours
  tracking_sensor: sensor.flightradar24_additional_tracked
  chosen_phone_targets: !input notify_entity
  flight_code: '{{ (airline_code | upper | trim) ~ (numeric_flight | trim | int(0))
    }}'
triggers:
- trigger: time_pattern
  hours: /12
  minutes: '0'
  id: check
- trigger: event
  event_type: flightradar24_tracked_took_off
  id: takeoff
- trigger: event
  event_type: flightradar24_tracked_landed
  id: landing
actions:
- choose:
  - conditions:
    - condition: trigger
      id: check
    sequence:
    - if:
      - condition: template
        value_template: "{{ now().date() >= (as_datetime(departure_date) - timedelta(days=2)).date()\n
          \  and now().date() <= (as_datetime(departure_date) + timedelta(days=3)).date()
          }}"
      then:
      - if:
        - condition: template
          value_template: '{{ now().date() >= (as_datetime(departure_date) + timedelta(days=3)).date()
            }}'
        then:
        - action: automation.turn_off
          target:
            entity_id: '{{ this.entity_id }}'
          data:
            stop_actions: false
        else:
        - if:
          - condition: template
            value_template: '{{ now().date() <= as_datetime(departure_date).date()
              }}'
          then:
          - action: aerodatabox_flights.lookup_flight
            data:
              flight_number: '{{ flight_code }}'
              date: '{{ departure_date }}'
            response_variable: schedule
          - if:
            - condition: template
              value_template: '{{ schedule is mapping and schedule.get(''flights'',
                []) | count > 0 }}'
            then:
            - variables:
                metadata_entity: '{{ ''input_text.flight_metadata_'' ~ (flight_code
                  | lower) ~ ''_'' ~ (departure_date | replace(''-'', ''_'')) }}'
                metadata_json: "{% set f = schedule.flights[0] %} {{ {'f': flight_code,
                  'd': departure_date, 'p': flight_travelers,\n    'o': f.get('departure_airport',''),\n
                  \   'a': f.get('arrival_airport',''),\n    'dep': f.get('scheduled_departure_utc',''),\n
                  \   'arr': f.get('scheduled_arrival_utc',''),\n    's': f.get('status',''),\n
                  \   'at': now().strftime('%Y-%m-%dT%H:%M:%S%z')} | to_json }}"
            - if:
              - condition: template
                value_template: '{{ has_value(metadata_entity) and (metadata_json
                  | length) <= 255 }}'
              then:
              - action: input_text.set_value
                target:
                  entity_id: '{{ metadata_entity }}'
                data:
                  value: '{{ metadata_json }}'
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.aerodatabox_last_successful_lookup
              data:
                datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.aerodatabox_lookup_succeeded
          - variables:
              departure_ts: "{{ as_timestamp(schedule.flights[0].scheduled_departure_utc,
                0)\n   if schedule is mapping and schedule.get('flights', []) | count
                > 0\n   else 0 }}"
          - if:
            - condition: template
              value_template: "{% set start = departure_ts | float(0) - early_hours
                | float(2) * 3600 %} {{ departure_ts | float(0) > 0\n   and as_timestamp(now())
                <= departure_ts | float(0)\n   and as_timestamp(now()) + 43200 >=
                start }}"
            - condition: template
              value_template: "{% set raw = state_attr(tracking_sensor, 'flights_recorded')
                or [] %} {{ flight_code not in (raw | selectattr('flight_number','defined')\n
                \ | map(attribute='flight_number') | map('replace',' ','')\n  | map('upper')
                | list) }}"
            then:
            - delay:
                seconds: '{{ [0, (departure_ts | float(0) - early_hours | float(2)
                  * 3600 - as_timestamp(now())) | int(0)] | max }}'
            - action: text.set_value
              target:
                entity_id: text.flightradar24_add_to_track
              data:
                value: '{{ flight_code }}'
  - conditions:
    - condition: template
      value_template: "{% if trigger.id not in ['takeoff','landing'] %}\n  {{ false
        }}\n{% else %}\n  {% set raw = trigger.event.data.get('flight_number', '')
        | upper | replace(' ', '') | replace('DAL','DL') %}\n  {% set normalized =
        raw[:2] ~ (raw[2:] | int(0)) if raw.startswith('DL') else raw %}\n  {{ normalized
        == flight_code and\n     as_timestamp(now()) >= as_timestamp(departure_date)
        - 86400 and\n     as_timestamp(now()) <= as_timestamp(departure_date) + 259200
        }}\n{% endif %}"
    sequence:
    - variables:
        phone_targets: "{{ chosen_phone_targets if chosen_phone_targets | count >
          0\n   else integration_entities('mobile_app')\n   | select('match', '^notify\\\\.')\n
          \  | reject('search', 'polestar')\n   | list }}"
        alexa_targets: "{% set ns = namespace(items=[]) %} {% for e in integration_entities('alexa_media')
          | select('match', '^media_player\\\\.') %}\n  {% if 'Echo' in (device_attr(e,
          'model') or '') and states(e) not in ['unavailable','unknown'] %}\n    {%
          set ns.items = ns.items + [e] %}\n  {% endif %}\n{% endfor %} {{ ns.items
          }}"
        flight_message: '{{ flight_code }} {{ ''has taken off'' if trigger.id == ''takeoff''
          else ''has landed'' }}. {% if trigger.event.data.get(''airport_destination_city'')
          %} Destination: {{ trigger.event.data.airport_destination_city }}. {% endif
          %}'
    - if:
      - condition: template
        value_template: '{{ phone_targets | count > 0 }}'
      then:
      - action: notify.send_message
        target:
          entity_id: '{{ phone_targets }}'
        data:
          title: '{{ ''Flight took off'' if trigger.id == ''takeoff'' else ''Flight
            landed'' }}'
          message: '{{ flight_message }}'
    - if:
      - condition: template
        value_template: '{{ alexa_targets | count > 0 }}'
      - condition: time
        after: 07:00:00
        before: '22:00:00'
      then:
      - action: notify.alexa_media
        data:
          target: '{{ alexa_targets }}'
          message: '{{ flight_message }}'
          data:
            type: announce
        continue_on_error: true
    - if:
      - condition: state
        entity_id: media_player.family_room_tv
        state: 'on'
      then:
      - action: notify.android_tv_fire_tv_192_168_68_72
        data:
          title: '{{ ''Flight took off'' if trigger.id == ''takeoff'' else ''Flight
            landed'' }}'
          message: '{{ flight_message }}'
        continue_on_error: true
    - if:
      - condition: trigger
        id: landing
      then:
      - action: text.set_value
        target:
          entity_id: text.flightradar24_remove_from_track
        data:
          value: '{{ flight_code }}'
        continue_on_error: true
      - action: automation.turn_off
        target:
          entity_id: '{{ this.entity_id }}'
        data:
          stop_actions: false
