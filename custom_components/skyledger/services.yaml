lookup_flight:
  name: Look up flight
  description: Retrieve flight schedule and update stored metadata.
  fields:
    flight_number:
      name: Flight number
      required: true
      selector:
        text: {}
    date:
      name: Departure date
      required: true
      selector:
        date: {}
save_flight:
  name: Save flight
  description: Add a new flight using AeroDataBox or update travelers on a saved flight.
  fields:
    flight_number:
      name: Flight number
      required: true
      selector:
        text: {}
    date:
      name: Departure date
      required: true
      selector:
        date: {}
    travelers:
      name: Travelers
      description: Select one or more Home Assistant people.
      selector:
        entity:
          domain: person
          multiple: true
list_flights:
  name: List flights
  description: Return stored flight records and lifetime statistics.
finalize_flight:
  name: Finalize flight
  description: Explicitly mark a stored flight landed or canceled.
  fields:
    flight_number:
      name: Flight number
      required: true
      selector:
        text: {}
    date:
      name: Departure date
      required: true
      selector:
        date: {}
    status:
      name: Final status
      required: true
      selector:
        select:
          options:
            - landed
            - canceled
delete_flight:
  name: Delete flight
  description: Permanently delete a saved flight record; does not delete automations.
  fields:
    flight_number:
      name: Flight number
      required: true
      selector:
        text: {}
    date:
      name: Departure date
      required: true
      selector:
        date: {}

preview_flight_alert:
  name: Preview flight alert
  description: Show notification actions without sending them.
  fields:
    flight_number:
      name: Flight number
      required: true
      selector:
        text: {}
    date:
      name: Departure date
      required: true
      selector:
        date: {}
    event:
      name: Event
      required: true
      selector:
        select:
          options:
            - takeoff
            - landing
    phones:
      name: Phone notify entities
      selector:
        entity:
          domain: notify
          multiple: true
    alexas:
      name: Alexa media players
      selector:
        entity:
          domain: media_player
          multiple: true
    tv_services:
      name: TV notify service names
      description: Optional service names, without notify prefix.
      selector:
        text:
          multiple: true

set_flight_alert_recipients:
  name: Set flight alert recipients
  description: Save selected phone, Alexa and TV targets for a flight; never sends alerts.
  fields:
    flight_number:
      name: Flight number
      required: true
      selector:
        text: {}
    date:
      name: Departure date
      required: true
      selector:
        date: {}
    phones:
      name: Selected phones
      selector:
        entity:
          domain: notify
          multiple: true
    alexas:
      name: Selected Alexa devices
      selector:
        entity:
          domain: media_player
          multiple: true
    tv_services:
      name: Selected TV notify service names
      selector:
        text:
          multiple: true
